name: Test & Build Package

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: TypeScript 🔍
        run: pnpm run check
      - name: Jest 🔍
        run: pnpm run spec
      - name: Build 💎
        run: pnpm run build
      - name: Codegen 🧬
        run: pnpm run codegen
      - name: Verify tarball 📦
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee pack.log
          grep -q "android/generated/java" pack.log || { echo "::error::android/generated missing from tarball"; exit 1; }
          if grep -q "\.test\." pack.log; then echo "::error::test files leaked into tarball"; exit 1; fi

  android:
    name: Android compile
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            example/pnpm-lock.yaml
      - name: Setup Java ☕
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle 🐘
        uses: gradle/actions/setup-gradle@v4
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Codegen 🧬
        run: pnpm run codegen
      - name: Install example 🪄
        working-directory: example
        run: pnpm install --frozen-lockfile
      - name: Compile library Kotlin 🤖
        working-directory: example/android
        run: ./gradlew :mgcrea_react-native-jetpack-compose:compileDebugKotlin --no-daemon
