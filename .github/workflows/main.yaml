name: Test & Build Package

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: TypeScript 🔍
        run: pnpm run check
      - name: Jest 🔍
        run: pnpm run spec
      - name: Build 💎
        run: pnpm run build
      - name: Codegen 🧬
        run: pnpm run codegen
      - name: Verify tarball 📦
        run: |
          set -euo pipefail
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json', 'utf8'))[0].files.map((f) => f.path);
            if (!files.some((f) => f.startsWith('android/generated/java'))) {
              console.error('::error::android/generated missing from tarball');
              process.exit(1);
            }
            const tests = files.filter((f) => f.includes('.test.'));
            if (tests.length) {
              console.error('::error::test files leaked into tarball: ' + tests.join(', '));
              process.exit(1);
            }
            console.log(\`tarball ok: \${files.length} files\`);
          "

  android:
    name: Android compile
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            example/pnpm-lock.yaml
      - name: Setup Java ☕
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle 🐘
        uses: gradle/actions/setup-gradle@v4
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Codegen 🧬
        run: pnpm run codegen
      - name: Install example 🪄
        working-directory: example
        run: pnpm install --frozen-lockfile
      - name: Compile library Kotlin 🤖
        working-directory: example/android
        run: ./gradlew :mgcrea_react-native-jetpack-compose:compileDebugKotlin --no-daemon
