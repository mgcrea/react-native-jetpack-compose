buildscript {
  ext.kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.1.20'
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlinVersion"
  }
}

def safeExtGet(prop, fallback) {
  return rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.facebook.react'

android {
  namespace 'com.mgcrea.reactnative.jetpackcompose'
  compileSdk safeExtGet('compileSdkVersion', 36)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 36)
    consumerProguardFiles 'consumer-rules.pro'
  }

  sourceSets {
    main {
      java.srcDirs += ["${projectDir}/generated/java"]
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  buildFeatures {
    compose = true
  }
}

kotlin {
  compilerOptions {
    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'

  // Material Components (for BottomSheetDialog)
  implementation 'com.google.android.material:material:1.14.0'

  // Jetpack Compose (versions pinned by the BOM)
  implementation platform('androidx.compose:compose-bom:2026.08.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material3:material3'
  // Core icon set only; the extended artifact is deliberately avoided (see ui/MaterialIcons.kt)
  implementation 'androidx.compose.material:material-icons-core'
}
